<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Buy Auction{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-brand" href="{% url 'home' %}">
                <span class="site-brand-mark">هنر</span>
                <span>
                    <span class="site-brand-title">کاتالوگ آثار</span>
                    <span class="site-brand-sub">Fine Art Registry</span>
                </span>
            </a>
            {% if request.user.is_authenticated %}
                <span class="site-header-user">{{ request.user.username }} · {{ request.user.role_display }}</span>
            {% endif %}
        </div>
    </header>
    <main class="page-shell">
        {% if messages %}
            <section class="messages-stack" aria-label="پیام‌ها">
                {% for message in messages %}
                    <div class="message message-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </section>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
